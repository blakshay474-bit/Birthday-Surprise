<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>For Mauli</title>
<meta name="description" content="A birthday letter for Mauli" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ambient falling petals -->
  <div class="petals" id="petals" aria-hidden="true"></div>

  <!-- ===== COVER / ENVELOPE SCENE ===== -->
  <section class="scene" id="scene">
    <p class="eyebrow">a small letter for</p>
    <h1 class="name-script">Mauli</h1>

    <button type="button" class="envelope" id="envelope" aria-label="Unfold your gift">
      <div class="envelope-inner">
        <div class="flap flap-top"></div>
        <div class="flap flap-bottom"></div>
        <div class="flap flap-left"></div>
        <div class="flap flap-right"></div>
        <div class="seal">
          <svg viewBox="0 0 100 100" class="seal-heart">
            <path d="M50 82 C20 60 4 40 4 22 C4 8 15 -2 28 4 C38 8 45 18 50 26 C55 18 62 8 72 4 C85 -2 96 8 96 22 C96 40 80 60 50 82Z"/>
          </svg>
        </div>
      </div>
    </button>

    <p class="hint">tap the seal to unfold</p>
  </section>

  <!-- ===== REVEAL SCENE ===== -->
  <section class="reveal" id="reveal" aria-hidden="true">
    <div class="poster-frame">
      <img src="assets/poster.png" alt="A birthday poster for Mauli, filled with flowers, notes, and a photo of her" class="poster-img" id="posterImg" />
    </div>

    <div class="message">
      <p class="date-label">17 · august · 22nd</p>
      <h2 class="message-title">Happy Birthday, Mauli</h2>
      <p class="message-body">stay blooming, and making the surrounding aromatic.</p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
